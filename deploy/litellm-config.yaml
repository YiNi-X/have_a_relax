model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      mode: chat
      description: Default low-cost DeepSeek chat model for internal testing.

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      mode: chat
      description: Higher-quality DeepSeek model. Enable for selected testers only if needed.

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  request_timeout: 120
  num_retries: 2
  drop_params: true
  extra_spend_tag_headers:
    - X-OpenWebUI-User-Id
    - X-OpenWebUI-User-Email
    - X-OpenWebUI-User-Role

general_settings:
  user_header_name: X-OpenWebUI-User-Id

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 60
