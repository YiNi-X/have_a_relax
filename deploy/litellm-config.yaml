model_list:
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat
      description: OpenAI GPT-5.5 model for internal team testing.

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  request_timeout: 120
  num_retries: 2
  drop_params: true
  extra_spend_tag_headers:
    - X-OpenWebUI-User-Id
    - X-OpenWebUI-User-Email
    - X-OpenWebUI-User-Role

general_settings:
  user_header_name: X-OpenWebUI-User-Id

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 60
